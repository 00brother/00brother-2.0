<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>00Brother</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      font-family: Arial, sans-serif;
    }

    .abertura {
      text-align: center;
      animation: aparecer 1s ease;
    }

    .abertura img {
      display: block;
      width: min(75vw, 340px);
      height: auto;
      margin: 0 auto;
    }

    .carregando {
      width: 42px;
      height: 42px;
      margin: 25px auto 0;
      border: 4px solid #e5e5e5;
      border-top-color: #c9a84c;
      border-radius: 50%;
      animation: girar 0.8s linear infinite;
    }

    @keyframes girar {
      to { transform: rotate(360deg); }
    }

    @keyframes aparecer {
      from { opacity: 0; transform: scale(0.96); }
      to { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>
  <main class="abertura">
    <img src="assets/logo-00brother-original.jpeg" alt="Logo 00Brother">
    <div class="carregando"></div>
  </main>

  <script>
    setTimeout(() => {
      window.location.replace("boas-vindas.html");
    }, 1800);
  </script>
</body>
</html>
